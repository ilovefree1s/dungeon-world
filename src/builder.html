<title>Hunter Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;800;900&display=swap">
<style>
/* layout: the hero on a stone dais fills the stage; the choices sit in a dark panel beside it (under it on a phone) */
:root{
  --ink:#0e0c0b; --panel:#17130f; --raise:#221c17; --line:rgba(255,240,220,.14);
  --text:#f6eee2; --dim:#bdb2a2; --gold:#ffc93c; --moss:#2c3a22;
  --display:"Luckiest Guy","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:600 15px/1.45 var(--body)}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px}
.stage{position:relative;min-height:0;background:radial-gradient(120% 90% at 50% 30%,#2a3424 0%,#141a12 55%,var(--ink) 100%)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#stage:active{cursor:grabbing}
.tag{position:absolute;left:max(18px,env(safe-area-inset-left,0px));top:16px;pointer-events:none}
.tag .k{font:900 11px var(--body);letter-spacing:.18em;color:var(--dim)}
.tag h1{margin:2px 0 0;font:400 clamp(30px,4vw,44px)/1 var(--display);color:var(--gold);letter-spacing:.02em;text-shadow:0 3px 0 #000;text-wrap:balance}
.tag p{margin:8px 0 0;max-width:34ch;color:var(--text);text-shadow:0 1px 2px #000}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font:800 11px var(--body);letter-spacing:.14em;color:var(--dim);white-space:nowrap;pointer-events:none}
.side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding-block:18px 22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.side h2{margin:0;font:400 22px var(--display);color:var(--gold);letter-spacing:.03em}
.lab{font:900 11px var(--body);letter-spacing:.16em;color:var(--dim);margin-bottom:8px}
#looks{display:grid;grid-template-columns:1fr;gap:6px}
.look{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:400 17px var(--display);letter-spacing:.03em;text-align:left;cursor:pointer}
.look .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);font:900 12px var(--body);color:var(--dim);flex:none}
.look:hover{border-color:rgba(255,201,60,.4)}
.look[aria-pressed="true"]{border-color:var(--gold);background:linear-gradient(90deg,rgba(255,201,60,.16),rgba(255,201,60,0) 70%);color:var(--gold)}
.look[aria-pressed="true"] .n{background:var(--gold);color:#1a1208}
.row{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.5);background:var(--c);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--gold)}
.seg{display:flex;gap:6px}
.btn{flex:1;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--raise);color:var(--text);font:900 12px var(--body);letter-spacing:.12em;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--gold);color:#1a1208;border-color:var(--gold)}
.btn:hover{border-color:rgba(255,201,60,.45)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pick{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#0f0c0a;display:flex;gap:10px;align-items:center}
#code{flex:1;min-width:0;font:800 12px/1.4 var(--body);color:var(--dim);overflow-wrap:anywhere}
.sl{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font:900 11px var(--body);letter-spacing:.1em;color:var(--dim);margin-top:6px}
.sl input{width:100%;accent-color:var(--gold)}
.sl b{font:800 12px var(--body);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.note{margin:0;color:var(--dim);font-size:13px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}
  html,body{height:auto}
  .side{border-left:0;border-top:1px solid var(--line)}
  #looks{grid-template-columns:1fr 1fr}
  .tag p{display:none}
}
</style>
<div class="app">
  <div class="stage">
    <canvas id="stage" aria-label="The hunter on a turntable"></canvas>
    <div class="tag"><div class="k">DUNGEON WORLD · HUNTER</div><h1 id="lookName">RANGER</h1><p id="lookBlurb"></p></div>
    <div class="hint">DRAG TO TURN · DOUBLE-CLICK TO SPIN</div>
  </div>
  <aside class="side">
    <h2>Hunter Builder</h2>
    <div><div class="lab">LOOK</div><div id="looks"></div></div>
    <div><div class="lab">MOTION</div><div class="seg" id="anims"><button class="btn anim" data-a="idle">STAND</button><button class="btn anim" data-a="walk">WALK</button><button class="btn anim" data-a="run">RUN</button><button class="btn anim" data-a="shoot">DRAW</button></div></div>
    <div hidden><div class="lab">VIEW</div><div class="seg"><button class="btn" id="ink">INK LINES</button><button class="btn" id="close">FACE CLOSE-UP</button></div></div>
    <div id="kayShape"><div class="lab">PROPORTIONS</div>
      <label class="sl"><span>LEG LENGTH</span><input type="range" id="shLeg" min="0.85" max="1.5" step="0.01" value="1"><b id="shLegV">100%</b></label>
      <label class="sl"><span>LEG THICKNESS</span><input type="range" id="shThick" min="0.8" max="1.4" step="0.01" value="1"><b id="shThickV">100%</b></label>
      <label class="sl"><span>HEAD SIZE</span><input type="range" id="shHead" min="0.7" max="1.2" step="0.01" value="1"><b id="shHeadV">100%</b></label>
    </div>
    <div hidden><div class="lab">SKIN</div><div class="row" id="swSkin"></div></div>
    <div hidden><div class="lab">HAIR</div><div class="row" id="swHair"></div></div>
    <div hidden><div class="lab">MAIN COLOR</div><div class="row" id="swMain"></div></div>
    <div hidden><div class="lab">ACCENT</div><div class="row" id="swAccent"></div></div>
    <div class="seg" hidden><button class="btn" id="shuffle">SHUFFLE COLORS</button><button class="btn" id="reset">LOOK'S OWN</button></div>
    <div hidden><div class="lab">YOUR PICK</div><div class="pick"><span id="code"></span><button class="btn" id="copy" style="flex:none">COPY</button></div></div>
    <p class="note">Set his proportions, then tell me and I'll put this hunter in the game.</p>
  </aside>
</div>
